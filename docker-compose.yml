name: reponto

services:
  db:
    image: postgres:16-alpine
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: mercado
      POSTGRES_PASSWORD: mercado
      POSTGRES_DB: mercado
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercado -d mercado"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://mercado:mercado@db:5432/mercado
      SECRET_KEY: ${SECRET_KEY:-reponto-dev-secret}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-chat}
      TZ: America/Sao_Paulo
      OBS_WINDOW_DAYS: ${OBS_WINDOW_DAYS:-90}
      EMA_HALF_LIFE_DAYS: ${EMA_HALF_LIFE_DAYS:-30}
      FRONTEND_ORIGINS: "http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}"
    volumes:
      - ./datasets:/datasets:ro
      - ml_data:/app/ml_data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  ml_data:
