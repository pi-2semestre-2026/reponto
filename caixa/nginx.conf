server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
    }
    # Volta ao Reponto na porta configurada (FRONTEND_PORT do .env), no mesmo host.
    # Este arquivo é um template: o nginx troca ${FRONTEND_PORT} ao subir o container.
    location = /reponto {
        return 302 http://$host:${FRONTEND_PORT}/dashboard;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
